name: QA Automation CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup 3.9 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install pipenv
      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          pipenv install --dev --python $(which python)

      # Step 5: Run tests and reports generate 
      - name: Run tests
        run: |
          mkdir -p test-results
          pipenv run pytest --junitxml=test-results/results.xml

      # Step 6: Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
