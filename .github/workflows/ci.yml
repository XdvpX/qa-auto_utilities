name: QA Automation CI Pipeline

# Trigger the pipeline on push to any branch or on pull request creation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    
    steps:
      # Step 1: Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Set up Python (or another language, depending on your needs)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Adjust the Python version if needed

      # Step 3: Install pipenv
      - name: Install pipenv
        run: |
          python -m pip install pipenv

      # Step 4: Install dependencies from Pipfile
      - name: Install dependencies
        run: |
          pipenv install --dev  # Installs both default and dev dependencies

      # Step 5: Run tests using pipenv
      - name: Run tests
        run: |
          pipenv run pytest  # Run pytest using pipenv

      # Step 6: Upload test reports (optional, using updated v4 of upload-artifact)
      - name: Upload test results
        if: failure()  # Upload only if tests fail
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: test-results
          path: test-results  # Path where your test reports are located
